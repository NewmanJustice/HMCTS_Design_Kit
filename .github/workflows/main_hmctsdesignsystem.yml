name: Deploy HMCTSDesignSystem-code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        working-directory: packages/hmcts-docs
        run: npm ci

      - name: Build (if present)
        working-directory: packages/hmcts-docs
        run: npm run build --if-present

      # Optional but recommended: fail fast if the app can't start
      - name: Smoke check
        run: node -c server.js || true

      - name: Check publish profile secret present
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
            if [ -z "$PUBLISH_PROFILE" ]; then
              echo "Publish profile secret is EMPTY"
              exit 1
            fi
            echo "Publish profile secret length: ${#PUBLISH_PROFILE}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: HMCTSDesignSystem-code
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: packages/hmcts-docs

